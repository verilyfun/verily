name: verily_brand
description: >-
  Verily's brand in code: colour tokens, the pin-check mark, the ✓erily
  wordmark, the verified stamp, and the launch reel and cover drawn with the
  Skribble design system.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  skribble: 0.3.1
  skribble_emoji: 0.3.1
  skribble_font_recursive: 0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  skribble_lints: 0.3.1
  # The workspace shares one resolution, and flutter_svg (through
  # serverpod_auth_idp_flutter) caps xml at 7.0.1.
  xml: 7.0.1

flutter:
  uses-material-design: true
