include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    # Treat the usual slips as errors.
    missing_return: error
    dead_code: error
    unused_element: error
    unused_import: error
    unused_local_variable: error
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_protocol/**"
    - "**/generated/**"
    - "**/.dart_tool/**"

linter:
  rules:
    # Serverpod's generated code and its public protocol classes do not carry
    # API docs, and its models run past 80 columns.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
