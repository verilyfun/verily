[package]
name = "verily_site"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "verily.fun, the landing page: leptoskit and Skribble, rendered to static HTML."

[[bin]]
name = "verily-site"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.9.0-rc0", features = ["ssr"] }
leptoskit = { workspace = true, features = ["web"] }
skribble_leptoskit = { workspace = true }
verily_ink = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
