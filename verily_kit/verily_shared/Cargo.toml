[package]
name = "verily_shared"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Domain records and evidence digests shared by the Verily app and backend."

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
