[package]
name = "verily_rewards"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Server-side actions, escrow checks, and payouts for Verily."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
leptoskit_db = { git = "https://github.com/ifiokjr/leptoskit", rev = "a9678a57ec571f2318342fd1f04d68c9666b072d", default-features = false, features = ["sqlite"] }
leptoskit_rpc = { git = "https://github.com/ifiokjr/leptoskit", rev = "a9678a57ec571f2318342fd1f04d68c9666b072d", default-features = false, features = ["sqlite"] }
monosecret = { version = "0.5.0", default-features = false, features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana_kit_associated_token_account = { git = "https://github.com/pina-rs/solana_kit", rev = "a46f32dcfccc4f73b6b5d68bdc6f541151c7e047", features = ["crypto"] }
solana_kit_client = { git = "https://github.com/pina-rs/solana_kit", rev = "a46f32dcfccc4f73b6b5d68bdc6f541151c7e047" }
solana_kit_core = { git = "https://github.com/pina-rs/solana_kit", rev = "a46f32dcfccc4f73b6b5d68bdc6f541151c7e047", features = ["crypto"] }
solana_kit_native = { git = "https://github.com/pina-rs/solana_kit", rev = "a46f32dcfccc4f73b6b5d68bdc6f541151c7e047" }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
verily_shared = { path = "../verily_shared" }

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
