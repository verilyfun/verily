# :schema https://leptoskit.dev/schemas/leptoskit.v0.schema.json

[app]
name = "verily_kit"
version = "0.1.0"
default_platform = "web"
platforms = ["web", "ios", "android", "macos", "windows", "linux"]
# The app renders in the browser: it sits behind sign-in, so server rendering
# buys no search traffic, and the landing page (verily_site) is static.
render = "csr"

[serve]
address = "127.0.0.1"
port = 8184

[l10n]
# One ARB file per locale, named for its language tag. `lk l10n` writes the
# typed module the screens read; `lk dev` and `lk build` keep it current.
dir = "verily_app/l10n"
output = "verily_app/src/l10n.rs"
template = "en"

[build]
# The crate the browser's Wasm module and the native guest are built from.
# The server is this workspace's binary. LeptosKit 0.3.0 no longer has a
# `backend` build flag.
client_package = "verily_app"

[native]
package_id = "fun.verily.app"
# LeptosKit 0.3.0 has no `camera`, `app-integrity`, or combined `sensors`
# plugin. Motion is six crates (accelerometer, gyroscope, magnetometer,
# barometer, light-sensor, pedometer); capture does not call them yet.
plugins = [
  "http",
  "location",
  "permissions",
  "speech",
  "secure-store",
  "crypto",
  "filesystem",
  "local-authentication",
  "device",
  "solana-wallet",
]

[native.plugin-options.http]
# The kit server as an iOS Simulator (localhost) and an Android emulator
# (10.0.2.2) reach it.
origins = ["http://localhost:8184", "http://127.0.0.1:8184", "http://10.0.2.2:8184"]

# Tables live in verily_backend. These commands read that crate:
# `lk db check`, `lk db migration create`, `lk db migrate`, `lk db status`.
[db]
dialect = "postgres"
crate = "verily_backend"
features = ["server"]
migrations = "verily_backend/migrations-postgres"
url_env = "DATABASE_URL"

[auth]
app_name = "Verily"
keys_env = "AUTH_ENCRYPTION_KEYS"

[auth.idp]
consent_page = "/consent"
device_page = "/device"

# A capitalized function that returns a view is a component, so it carries
# `#[component]`. `lk lint` denies a missing attribute.
[lint]
markup = "view"

[lint.rules]
component_attribute = "deny"

# File routes live in verily_app. `lk plugin:router routes` regenerates
# that crate's module from those files. `lk routes` forwards to it.
[[plugins]]
name = "router"

[plugins.options]
dir = "verily_app/src/routes"
