# Monosecret resolves these names before `lk dev` starts.
# Commit declarations; store values in a provider, never in this file.
# Development reads the ignored .env (mode 0600) first, then the Development
# vault item "Verily". Production injects the environment. Do not call `op`.

[project]
name = "verily_kit"
revision = "1.0"
require_reason = "agents"

[providers]
dotenv = "dotenv:.env"
injected = "env://"
op = { uri = "op+token://Development", ref = { item = "Verily", field = "{key}" }, depends_on = [{ secret = "OP_SERVICE_ACCOUNT_TOKEN" }] }
op_desktop = { uri = "onepassword://kickjump@Development", ref = { item = "Verily", field = "{key}" } }

[groups]
bootstrap = "Secret-provider authentication"
runtime = "LeptosKit server and authentication"
verification = "Proof verification, device attestation, and AI"
storage = "Backblaze B2 private evidence storage"
rewards = "Solana reward escrow and KMS custody"
platform = "Partner Verily Apps signing keys"

# `lk dev` runs `monosecret run` without a profile, so this profile is the
# development route. Production uses `monosecret run --profile production`.
[profiles.default.defaults]
providers = ["dotenv", "op", "op_desktop", "injected"]

[profiles.default]
OP_SERVICE_ACCOUNT_TOKEN = { description = "1Password service-account token kept in the ignored .env; bootstraps the Development vault route", required = false, providers = ["dotenv", "injected"], groups = ["bootstrap"] }
DATABASE_URL = { description = "Postgres URL for the Verily server. Unset, `lk dev` uses its development database.", required = false, groups = ["runtime"] }
AUTH_ENCRYPTION_KEYS = { description = "Sign-in encryption key ring for leptoskit_auth", required = false, groups = ["runtime"] }
VERILY_RESEND_API_KEY = { description = "Optional Resend API key for email sign-in codes", required = false, groups = ["runtime"] }
VERILY_GOOGLE_CLIENT_ID = { description = "Optional Google OAuth client ID", required = false, groups = ["runtime"] }
VERILY_GOOGLE_CLIENT_SECRET = { description = "Optional Google OAuth client secret", required = false, groups = ["runtime"] }
VERILY_ABUSE_RISK_SALT = { description = "Optional salt for rotating abuse-correlation pseudonyms", required = false, type = "base64", generate = { bytes = 32 }, groups = ["runtime"] }
VERILY_RECEIPT_SIGNING_PRIVATE_KEY = { description = "Ed25519 seed (32 bytes, base64) for signing partner verification receipts", required = false, type = "base64", generate = { bytes = 32 }, groups = ["platform"] }
VERILY_B2_ENDPOINT = { description = "Optional Backblaze B2 S3-compatible endpoint for private evidence", required = false, groups = ["storage"] }
VERILY_B2_REGION = { description = "Optional Backblaze B2 region", required = false, groups = ["storage"] }
VERILY_B2_BUCKET = { description = "Optional Backblaze B2 private evidence bucket name", required = false, groups = ["storage"] }
VERILY_B2_KEY_ID = { description = "Optional bucket-scoped Backblaze B2 application key ID", required = false, groups = ["storage"] }
VERILY_B2_APPLICATION_KEY = { description = "Optional bucket-scoped Backblaze B2 application key", required = false, groups = ["storage"] }
VERILY_OPENROUTER_API_KEY = { description = "Optional backend-only OpenRouter key for AI verification and drafting", required = false, groups = ["verification"] }
VERILY_MEDIA_VERIFIER_TOKEN = { description = "Optional bearer token for an external private media verifier", required = false, groups = ["verification"] }
VERILY_GOOGLE_PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON = { description = "Optional Google service-account JSON for Play Integrity decoding", required = false, groups = ["verification"] }
VERILY_APPLE_DEVICECHECK_KEY_ID = { description = "Optional Apple DeviceCheck key ID", required = false, providers = ["dotenv", "injected"], groups = ["verification"] }
VERILY_APPLE_DEVICECHECK_PRIVATE_KEY = { description = "Optional Apple DeviceCheck P-256 PKCS#8 private key (.p8)", required = false, providers = ["dotenv", "injected"], groups = ["verification"] }
VERILY_REWARD_SOLANA_RPC_URL = { description = "Optional devnet or local-validator Solana RPC URL for reward escrow", required = false, groups = ["rewards"] }
VERILY_REWARD_ARBITER_KEYPAIR = { description = "Optional devnet-only arbiter keypair (Solana CLI JSON array); never staging/production", required = false, groups = ["rewards"] }
VERILY_REWARD_FEE_PAYER_KEYPAIR = { description = "Optional devnet-only fee-payer keypair (Solana CLI JSON array); never staging/production", required = false, groups = ["rewards"] }
VERILY_REWARD_KMS_CREDENTIALS_JSON = { description = "Optional Google Cloud KMS service-account JSON for reward signing", required = false, groups = ["rewards"] }

[profiles.staging.defaults]
providers = ["injected"]

[profiles.staging]
DATABASE_URL = { description = "Staging Postgres + PostGIS connection URL", required = true, groups = ["runtime"] }
AUTH_ENCRYPTION_KEYS = { description = "Staging sign-in encryption key ring for leptoskit_auth", required = true, groups = ["runtime"] }
VERILY_RESEND_API_KEY = { description = "Staging Resend API key for email sign-in codes", required = false, groups = ["runtime"] }
VERILY_GOOGLE_CLIENT_ID = { description = "Staging Google OAuth client ID", required = false, groups = ["runtime"] }
VERILY_GOOGLE_CLIENT_SECRET = { description = "Staging Google OAuth client secret", required = false, groups = ["runtime"] }
VERILY_ABUSE_RISK_SALT = { description = "Staging abuse-correlation pseudonym salt", required = true, groups = ["runtime"] }
VERILY_RECEIPT_SIGNING_PRIVATE_KEY = { description = "Staging Ed25519 seed (32 bytes, base64) for partner receipts", required = true, groups = ["platform"] }
VERILY_B2_ENDPOINT = { description = "Staging Backblaze B2 S3 endpoint", required = true, groups = ["storage"] }
VERILY_B2_REGION = { description = "Staging Backblaze B2 region", required = true, groups = ["storage"] }
VERILY_B2_BUCKET = { description = "Staging Backblaze B2 private evidence bucket", required = true, groups = ["storage"] }
VERILY_B2_KEY_ID = { description = "Staging Backblaze B2 key ID", required = true, groups = ["storage"] }
VERILY_B2_APPLICATION_KEY = { description = "Staging Backblaze B2 application key", required = true, groups = ["storage"] }
VERILY_OPENROUTER_API_KEY = { description = "Staging OpenRouter API key (requires prompt-injection guardrail block confirmation)", required = false, groups = ["verification"] }
VERILY_GOOGLE_PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON = { description = "Staging Play Integrity service-account JSON", required = false, groups = ["verification"] }
VERILY_APPLE_DEVICECHECK_KEY_ID = { description = "Staging Apple DeviceCheck key ID", required = false, groups = ["verification"] }
VERILY_APPLE_DEVICECHECK_PRIVATE_KEY = { description = "Staging Apple DeviceCheck P-256 private key", required = false, groups = ["verification"] }
VERILY_REWARD_SOLANA_RPC_URL = { description = "Staging Solana RPC URL", required = false, groups = ["rewards"] }
VERILY_REWARD_KMS_CREDENTIALS_JSON = { description = "Staging Cloud KMS credentials JSON for arbiter and fee payer", required = false, groups = ["rewards"] }

[profiles.production.defaults]
# Production processes read secrets only from the injected environment.
providers = ["injected"]

[profiles.production]
DATABASE_URL = { description = "Production Postgres + PostGIS connection URL", required = true, groups = ["runtime"] }
AUTH_ENCRYPTION_KEYS = { description = "Production sign-in encryption key ring for leptoskit_auth", required = true, groups = ["runtime"] }
VERILY_RESEND_API_KEY = { description = "Production Resend API key for email sign-in codes", required = false, groups = ["runtime"] }
VERILY_GOOGLE_CLIENT_ID = { description = "Production Google OAuth client ID", required = false, groups = ["runtime"] }
VERILY_GOOGLE_CLIENT_SECRET = { description = "Production Google OAuth client secret", required = false, groups = ["runtime"] }
VERILY_ABUSE_RISK_SALT = { description = "Production abuse-correlation pseudonym salt", required = true, groups = ["runtime"] }
VERILY_RECEIPT_SIGNING_PRIVATE_KEY = { description = "Production Ed25519 seed (32 bytes, base64) for partner receipts", required = true, groups = ["platform"] }
VERILY_B2_ENDPOINT = { description = "Production Backblaze B2 S3 endpoint", required = true, groups = ["storage"] }
VERILY_B2_REGION = { description = "Production Backblaze B2 region", required = true, groups = ["storage"] }
VERILY_B2_BUCKET = { description = "Production Backblaze B2 private evidence bucket", required = true, groups = ["storage"] }
VERILY_B2_KEY_ID = { description = "Production Backblaze B2 key ID", required = true, groups = ["storage"] }
VERILY_B2_APPLICATION_KEY = { description = "Production Backblaze B2 application key", required = true, groups = ["storage"] }
VERILY_OPENROUTER_API_KEY = { description = "Production OpenRouter key (requires prompt-injection guardrail block + ZDR confirmation)", required = false, groups = ["verification"] }
VERILY_MEDIA_VERIFIER_TOKEN = { description = "Bearer token when an external cloud media verifier is enabled", required = false, groups = ["verification"] }
VERILY_GOOGLE_PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON = { description = "Production Play Integrity service-account JSON", required = false, groups = ["verification"] }
VERILY_APPLE_DEVICECHECK_KEY_ID = { description = "Production Apple DeviceCheck key ID", required = false, groups = ["verification"] }
VERILY_APPLE_DEVICECHECK_PRIVATE_KEY = { description = "Production Apple DeviceCheck P-256 private key (.p8)", required = false, groups = ["verification"] }
VERILY_REWARD_SOLANA_RPC_URL = { description = "Production Solana RPC URL when reward escrow is enabled", required = false, groups = ["rewards"] }
VERILY_REWARD_KMS_CREDENTIALS_JSON = { description = "Production Cloud KMS service-account JSON for arbiter and fee payer", required = false, groups = ["rewards"] }
