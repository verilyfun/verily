# Monosecret resolves these names before `lk dev` starts.
# Commit declarations; store values in a provider, never in this file.
# Development reads the ignored .env (mode 0600) first, then the Development
# vault item "Verily". Production injects the environment. Do not call `op`.

[project]
name = "verily_kit"
revision = "1.0"

[providers]
dotenv = "dotenv:.env"
injected = "env://"
op = { uri = "op+token://Development", ref = { item = "Verily", field = "{key}" }, depends_on = [{ secret = "OP_SERVICE_ACCOUNT_TOKEN" }] }
op_desktop = { uri = "onepassword://kickjump@Development", ref = { item = "Verily", field = "{key}" } }

# `lk dev` runs `monosecret run` without a profile, so this profile is the
# development route. Production uses `monosecret run --profile production`.
[profiles.default.defaults]
providers = ["dotenv", "op", "op_desktop", "injected"]

[profiles.default]
OP_SERVICE_ACCOUNT_TOKEN = { description = "1Password service-account token kept in the ignored .env; bootstraps the Development vault route", required = false, providers = ["dotenv", "injected"] }
DATABASE_URL = { description = "Postgres URL for the Verily server. Unset, `lk dev` uses its development database.", required = false }
AUTH_ENCRYPTION_KEYS = { description = "Sign-in encryption key ring for leptoskit_auth", required = false }
VERILY_REWARD_SOLANA_RPC_URL = { description = "Solana RPC URL for the reward escrow gateway", required = false }
VERILY_REWARD_KMS_CREDENTIALS_JSON = { description = "Cloud KMS credentials allowed to sign with the reward arbiter and fee-payer keys", required = false }

[profiles.production.defaults]
providers = ["injected"]

[profiles.production]
DATABASE_URL = { description = "Postgres URL for the Verily server", required = true }
AUTH_ENCRYPTION_KEYS = { description = "Sign-in encryption key ring for leptoskit_auth", required = true }
VERILY_REWARD_SOLANA_RPC_URL = { description = "Solana RPC URL for the reward escrow gateway", required = false }
VERILY_REWARD_KMS_CREDENTIALS_JSON = { description = "Cloud KMS credentials allowed to sign with the reward arbiter and fee-payer keys", required = false }
