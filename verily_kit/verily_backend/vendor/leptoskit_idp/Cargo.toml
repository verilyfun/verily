[package]
name = "leptoskit_idp"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.95.0"
description = "Patched leptoskit_idp: Grant.on_account_merge for Verily db check (pin 33ad5e1171f97f4086bf6ec9290e75aef956cdc0)."

[dependencies]
axum = { version = "0.8", optional = true, default-features = false, features = ["form", "json", "query"] }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
getrandom = { version = "0.3", optional = true }
leptos = { version = "0.9.0-rc0", optional = true, default-features = false }
leptoskit_auth = { git = "https://github.com/ifiokjr/leptoskit", rev = "33ad5e1171f97f4086bf6ec9290e75aef956cdc0", default-features = false }
leptoskit_config = { git = "https://github.com/ifiokjr/leptoskit", rev = "33ad5e1171f97f4086bf6ec9290e75aef956cdc0", default-features = false, optional = true }
leptoskit_db = { git = "https://github.com/ifiokjr/leptoskit", rev = "33ad5e1171f97f4086bf6ec9290e75aef956cdc0", default-features = false }
leptoskit_query = { git = "https://github.com/ifiokjr/leptoskit", rev = "33ad5e1171f97f4086bf6ec9290e75aef956cdc0", default-features = false, optional = true }
leptoskit_rpc = { git = "https://github.com/ifiokjr/leptoskit", rev = "33ad5e1171f97f4086bf6ec9290e75aef956cdc0", default-features = false, optional = true }
p256 = { version = "0.14", optional = true, default-features = false, features = ["ecdsa"] }
ring = { version = "0.17", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = { version = "0.7", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
thiserror = "2"
tower = { version = "0.5", optional = true, default-features = false }
url = { version = "2", optional = true }
uuid = { version = "1", optional = true, features = ["serde"] }

[dev-dependencies]
# Match upstream leptoskit_idp so `cargo clippy --workspace --all-targets`
# (via `lk lint`) can compile the unit tests that ship with this vendor copy.
any_spawner = { version = "0.3", features = ["tokio"] }
axum = { version = "0.8", default-features = false, features = ["form", "json", "query", "tokio"] }
base64 = "0.22"
http-body-util = "0.1"
leptos = { version = "0.9.0-rc0", default-features = false, features = ["ssr"] }
leptoskit_rpc = { git = "https://github.com/ifiokjr/leptoskit", rev = "33ad5e1171f97f4086bf6ec9290e75aef956cdc0", default-features = false, features = ["ssr"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
ring = "0.17"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
url = "2"

[features]
default = []
server = [
  "dep:base64",
  "dep:getrandom",
  "dep:leptoskit_config",
  "dep:leptoskit_rpc",
  "dep:p256",
  "dep:ring",
  "dep:sha2",
  "dep:subtle",
  "dep:url",
  "dep:uuid",
  "leptoskit_auth/server",
  "leptoskit_db/server",
]
postgres = ["server", "leptoskit_auth/postgres"]
sqlite = ["server", "leptoskit_auth/sqlite"]
axum = [
  "server",
  "dep:axum",
  "dep:serde_urlencoded",
  "dep:tower",
  "leptoskit_auth/axum",
  "leptoskit_rpc/ssr",
]
client = ["dep:leptoskit_query", "leptoskit_auth/client"]
web = ["client", "leptoskit_auth/web"]
guest = ["client", "leptoskit_auth/guest"]
ssr = ["client", "dep:leptos", "leptos/ssr", "leptoskit_auth/ssr"]
