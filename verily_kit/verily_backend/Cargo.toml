[package]
name = "verily_backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Verily's LeptosKit Axum host: db, auth, idp, RPC, jobs, partner API, and mounts for verification and rewards."

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
hmac = "0.12"
leptoskit_auth = { workspace = true, features = ["axum", "oauth", "postgres", "rpc", "sqlite"] }
leptoskit_axum = { workspace = true }
leptoskit_config = { workspace = true }
leptoskit_db = { workspace = true, features = ["geo", "postgres", "sqlite"] }
leptoskit_db_macros = { workspace = true }
leptoskit_db_schema = { workspace = true }
leptoskit_idp = { workspace = true, default-features = false, features = ["axum", "postgres", "sqlite"] }
leptoskit_rpc = { workspace = true, default-features = false, features = ["live", "postgres", "server", "sqlite"] }
monosecret = { workspace = true }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
solana_kit_associated_token_account = { workspace = true, features = ["crypto"] }
solana_kit_core = { workspace = true, features = ["crypto"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
verily_api = { path = "../verily_api" }
verily_rewards = { path = "../verily_rewards" }
verily_shared = { path = "../verily_shared" }
verily_verification = { path = "../verily_verification" }

[features]
default = ["server"]
server = []

[dev-dependencies]
leptoskit_auth = { workspace = true, features = ["axum", "rpc", "sqlite"] }
leptoskit_db = { workspace = true, features = ["geo", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
verily_app = { path = "../verily_app", features = ["service"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
