[package]
name = "verily_backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Verily's LeptosKit Axum host: db, auth, idp, RPC, and mounts for verification and rewards."

[dependencies]
leptoskit_auth = { workspace = true, features = ["axum", "oauth", "postgres", "rpc", "sqlite"] }
leptoskit_axum = { workspace = true }
leptoskit_config = { workspace = true }
leptoskit_db = { workspace = true, features = ["postgres", "sqlite"] }
leptoskit_db_macros = { workspace = true }
leptoskit_db_schema = { workspace = true }
leptoskit_idp = { workspace = true, default-features = false, features = ["axum", "postgres", "sqlite"] }
leptoskit_rpc = { workspace = true, default-features = false, features = ["live", "postgres", "server", "sqlite"] }
monosecret = { workspace = true }
thiserror = { workspace = true }
# Path deps on domain crates (temporary [workspace] until the shell lists members).
verily_rewards = { path = "../verily_rewards" }
verily_verification = { path = "../verily_verification" }

[features]
default = ["server"]
# The host is always the server side of the tables. Named so `leptoskit.toml`'s
# `[db] features = ["server"]` matches the scaffold the CLI expects.
server = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
