[package]
name = "verily_app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.95"
description = "Verily screens for doing, capturing, creating, reviewing, and account."

# rlib for the server and tests; cdylib for the browser's Wasm module and the
# native runners' Wasm guest.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
leptos = { version = "0.9.0-rc0", default-features = false, optional = true }
leptoskit = { workspace = true, features = ["auth", "l10n", "query", "rpc"] }
leptoskit_bridge = { workspace = true, optional = true }
leptoskit_l10n = { workspace = true }
leptoskit_plugin_app_integrity = { workspace = true, optional = true }
leptoskit_plugin_camera = { workspace = true, optional = true }
leptoskit_plugin_permissions = { workspace = true, optional = true }
leptoskit_router = { workspace = true }
# Signals that outlive a screen rebuild (see `state.rs`).
reactive_graph = "0.3.0-rc0"
schemars = { version = "1.2", features = ["semver1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skribble_leptoskit = { workspace = true }
# The records the operations in `ops.rs` send and return, shared with the backend.
verily_api = { path = "../verily_api" }
# The server's bodies for `ops.rs`; only the `service` feature links it.
verily_backend = { path = "../verily_backend", optional = true }
verily_ink = { workspace = true }
verily_shared = { path = "../verily_shared" }
# The CLI's embedded wasm-bindgen accepts exactly its matching library version.
wasm-bindgen = { version = "=0.2.129", optional = true }

[features]
default = []
# Browser host. The capture screen still refuses a file picker.
web = ["leptoskit/web", "leptoskit_l10n/web", "leptoskit_router/web", "dep:leptos", "dep:wasm-bindgen"]
# The browser renders on the client only, hydrates server markup, or is the server.
csr = ["web", "leptos/csr"]
hydrate = ["web", "leptos/hydrate"]
ssr = ["web", "leptos/ssr"]
# Native guest. Android is the first phone target; iOS uses the same guest.
native = [
  "leptoskit/guest",
  "dep:leptoskit_bridge",
  "dep:leptoskit_plugin_app_integrity",
  "dep:leptoskit_plugin_camera",
  "dep:leptoskit_plugin_permissions",
  "leptoskit_plugin_app_integrity/guest",
  "leptoskit_plugin_camera/guest",
  "leptoskit_plugin_permissions/guest",
]
android = ["native", "leptoskit/android"]
ios = ["native", "leptoskit/ios"]
macos = ["native", "leptoskit/macos"]
windows = ["native", "leptoskit/windows"]
linux = ["native", "leptoskit/linux"]
# The server's build: keeps the bodies of the `service = "verily-backend"`
# operations in `ops.rs`, which call `verily_backend::serve`. The browser and
# the native guest never turn it on. `leptoskit_rpc` requires this name.
service = ["dep:verily_backend"]
# The DevTools agents; `lk dev` turns this on, `lk build` never does.
devtools = ["leptoskit/devtools"]

[build-dependencies]
leptoskit_build = { workspace = true }

[dev-dependencies]
any_spawner = { workspace = true, features = ["futures-executor"] }
leptoskit = { workspace = true, features = ["leptos"] }
leptoskit_testing = { workspace = true }
