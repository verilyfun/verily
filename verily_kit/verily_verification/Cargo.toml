[package]
name = "verily_verification"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.95"
description = "Server-side Verily verification. Fail closed. Mounted by verily_backend."

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
regex = "1"
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = "2"
verily_shared = { path = "../verily_shared" }
