[package]
name = "skribble_leptoskit"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish = false
description = "Vendored skribble_leptoskit: shares Verily's git+rev leptoskit pin (Skribble upstream still names branch = \"main\")."

[dependencies]
leptoskit = { workspace = true }
skribble_rough = { path = "../skribble_rough" }

# Mirror openbudgetfun/skribble workspace clippy allows.
[lints.clippy]
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
