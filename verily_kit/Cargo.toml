[package]
name = "verily_kit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Verily shell. Development runs through the LeptosKit CLI."

[workspace]
resolver = "2"
members = [
  "android",
  "ios",
  "linux",
  "macos",
  "vendor/skribble_leptoskit",
  "vendor/skribble_rough",
  "verily_api",
  "verily_app",
  "verily_backend",
  "verily_rewards",
  "verily_shared",
  "verily_site",
  "verily_verification",
  "windows",
]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95.0"

[workspace.dependencies]
any_spawner = "0.3"
leptoskit = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_android = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_animation = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_appkit = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_aria = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_auth = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_axum = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_bridge = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_bridge_ffi = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_build = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_config = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_db = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_db_macros = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_db_schema = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_form = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_idp = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_l10n = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_l10n_codegen = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_native = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_plugin = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_plugin_crypto = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_plugin_device = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_plugin_filesystem = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_plugin_http = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_plugin_local_authentication = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_plugin_location = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_plugin_permissions = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_plugin_secure_store = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_plugin_sensors = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_plugin_speech = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_query = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_router = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_router_codegen = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_rpc = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
leptoskit_uikit = { git = "https://github.com/ifiokjr/leptoskit", rev = "c7a85ef05c4a1a510f6136b444ad4a0c2ef1af5e", default-features = false }
monosecret = { version = "0.5.0", default-features = false, features = ["client"] }
serde_json = "1"
# Skribble path vendor: upstream still uses branch = "main" for leptoskit,
# which duplicates Verily's rev pin. See vendor/VENDOR.md.
skribble_leptoskit = { path = "vendor/skribble_leptoskit" }
skribble_rough = { path = "vendor/skribble_rough" }
solana_kit = { git = "https://github.com/pina-rs/solana_kit", rev = "a46f32dcfccc4f73b6b5d68bdc6f541151c7e047" }
thiserror = "2"

[dependencies]
leptoskit = { workspace = true, features = ["server", "web", "db-postgres"] }
leptoskit_axum = { workspace = true }
verily_app = { path = "verily_app", default-features = false, features = ["service"] }
verily_backend = { path = "verily_backend" }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep host proc-macros loadable on macOS 27 (rust-lang/rust#157750).
[profile.release.build-override]
strip = "none"
