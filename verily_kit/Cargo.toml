[package]
name = "verily_kit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Verily shell. Development runs through the LeptosKit CLI."

[[bin]]
name = "verily-kit"
path = "src/main.rs"

[workspace]
resolver = "2"
exclude = ["patches/solana_kit_native"]
members = [
  "android",
  "ios",
  "linux",
  "macos",
  "verily_api",
  "verily_app",
  "verily_backend",
  "verily_ink",
  "verily_rewards",
  "verily_shared",
  "verily_site",
  "verily_verification",
  "windows",
]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95.0"

[workspace.dependencies]
any_spawner = "0.3"
leptoskit = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_auth = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_axum = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_bridge = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_bridge_ffi = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_build = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_config = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_db = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_db_macros = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_db_schema = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_idp = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_l10n = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_app_integrity = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_camera = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_crypto = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_device = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_filesystem = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_http = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_local_authentication = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_location = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_permissions = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_secure_store = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_sensors = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_plugin_speech = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_router = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_rpc = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
leptoskit_testing = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217", default-features = false }
monosecret = { version = "0.5.0", default-features = false, features = ["client"] }
serde_json = "1"
# Skribble's leptoskit components, from its pull request
# openbudgetfun/skribble#278 until leptoskit releases and Skribble publishes.
skribble_leptoskit = { git = "https://github.com/openbudgetfun/skribble", rev = "9e401c7293f70bda076a63404e37208535ea3cfa" }
thiserror = "2"
verily_ink = { path = "verily_ink" }

[dependencies]
leptoskit = { workspace = true, features = ["server", "web", "db-postgres"] }
leptoskit_axum = { workspace = true }
verily_app = { path = "verily_app", default-features = false, features = ["service"] }
verily_backend = { path = "verily_backend" }

# Skribble asks for leptoskit 0.3 from crates.io. Patch it to the commit every
# leptoskit crate above is pinned to, so the graph holds one leptoskit. Bump
# this rev with the others. solana_kit a46f32d selects the bridge, native, and
# wasm crates from crates.io at =0.3.0; those follow the same revision.
[patch.crates-io]
leptoskit = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217" }
leptoskit_bridge = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217" }
leptoskit_bridge_ffi = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217" }
leptoskit_native = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217" }
leptoskit_wasm = { git = "https://github.com/ifiokjr/leptoskit", rev = "67165da4842b729de1ea43dee531c94d613df217" }

# solana_kit_native at a46f32d pins rustix =1.1.5. xattr 1.7 in this graph
# requires rustix ^1.1.6. The patch keeps that revision's sources and accepts
# 1.1.6, so the Android wallet host can depend on `wallet-host`.
[patch."https://github.com/pina-rs/solana_kit"]
solana_kit_native = { path = "patches/solana_kit_native" }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep host proc-macros loadable on macOS 27 (rust-lang/rust#157750).
[profile.release.build-override]
strip = "none"
