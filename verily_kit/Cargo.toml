[package]
name = "verily_kit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Verily shell. Development runs through the LeptosKit CLI."

[[bin]]
name = "verily-kit"
path = "src/main.rs"

[workspace]
resolver = "2"
exclude = ["patches/solana_kit_native"]
members = [
  "android",
  "ios",
  "linux",
  "macos",
  "verily_api",
  "verily_app",
  "verily_backend",
  "verily_ink",
  "verily_rewards",
  "verily_shared",
  "verily_site",
  "verily_verification",
  "windows",
]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95.0"

# LeptosKit v0.3.0 is on crates.io (tag v0.3.0, commit
# 2e575b1e7e8100910667e7c2e1472a792d569c95). Every crate below is the exact
# published requirement. The CLI is `leptoskit_cli` at the same requirement;
# devenv and the store workflow read the `leptoskit` line. Do not add a
# `[patch.crates-io]` override for these crates: Skribble and solana_kit also
# select 0.3.0 from crates.io, and a second source would build LeptosKit twice.
# v0.3.0 does not publish `leptoskit_plugin_camera`,
# `leptoskit_plugin_app_integrity`, or `leptoskit_plugin_sensors` (motion is
# accelerometer, gyroscope, magnetometer, barometer, light sensor, and pedometer).
[workspace.dependencies]
any_spawner = "0.3"
leptoskit = { version = "=0.3.0", default-features = false }
leptoskit_auth = { version = "=0.3.0", default-features = false }
leptoskit_axum = { version = "=0.3.0", default-features = false }
leptoskit_bridge = { version = "=0.3.0", default-features = false }
leptoskit_bridge_ffi = { version = "=0.3.0", default-features = false }
leptoskit_build = { version = "=0.3.0", default-features = false }
leptoskit_config = { version = "=0.3.0", default-features = false }
leptoskit_db = { version = "=0.3.0", default-features = false }
leptoskit_db_macros = { version = "=0.3.0", default-features = false }
leptoskit_db_schema = { version = "=0.3.0", default-features = false }
leptoskit_idp = { version = "=0.3.0", default-features = false }
leptoskit_l10n = { version = "=0.3.0", default-features = false }
leptoskit_plugin_crypto = { version = "=0.3.0", default-features = false }
leptoskit_plugin_device = { version = "=0.3.0", default-features = false }
leptoskit_plugin_filesystem = { version = "=0.3.0", default-features = false }
leptoskit_plugin_http = { version = "=0.3.0", default-features = false }
leptoskit_plugin_local_authentication = { version = "=0.3.0", default-features = false }
leptoskit_plugin_location = { version = "=0.3.0", default-features = false }
leptoskit_plugin_permissions = { version = "=0.3.0", default-features = false }
leptoskit_plugin_secure_store = { version = "=0.3.0", default-features = false }
leptoskit_plugin_speech = { version = "=0.3.0", default-features = false }
leptoskit_router = { version = "=0.3.0", default-features = false }
leptoskit_rpc = { version = "=0.3.0", default-features = false }
leptoskit_testing = { version = "=0.3.0", default-features = false }
monosecret = { version = "0.5.0", default-features = false, features = ["client"] }
serde_json = "1"
# Skribble's leptoskit components, from its pull request
# openbudgetfun/skribble#278 until leptoskit releases and Skribble publishes.
skribble_leptoskit = { git = "https://github.com/openbudgetfun/skribble", rev = "9e401c7293f70bda076a63404e37208535ea3cfa" }
thiserror = "2"
verily_ink = { path = "verily_ink" }

[dependencies]
leptoskit = { workspace = true, features = ["server", "web", "db-postgres"] }
leptoskit_axum = { workspace = true }
verily_app = { path = "verily_app", default-features = false, features = ["service"] }
verily_backend = { path = "verily_backend" }

# solana_kit_native at a46f32d pins rustix =1.1.5. xattr 1.7 in this graph
# requires rustix ^1.1.6. The patch keeps that revision's sources and accepts
# 1.1.6, so the Android wallet host can depend on `wallet-host`.
[patch."https://github.com/pina-rs/solana_kit"]
solana_kit_native = { path = "patches/solana_kit_native" }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep host proc-macros loadable on macOS 27 (rust-lang/rust#157750).
[profile.release.build-override]
strip = "none"
