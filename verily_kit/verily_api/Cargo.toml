[package]
name = "verily_api"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.95"
description = "Records Verily's screens send to verily_backend and get back."

[dependencies]
schemars = { version = "1.2", features = ["semver1"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
