name: verily_flutter
description: Do it, prove it, get paid. Real-world actions with live-captured proof and escrowed rewards.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

# Every hosted dependency names one exact version; the verily_lints
# `enforce_pinned_app_dependencies` rule rejects carets and ranges here.
dependencies:
  camera: 0.12.2
  clock: 1.1.3
  cross_file: 0.3.5+5
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_hooks: 0.21.4
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: 2.4.8
  flutter_timezone: 5.1.1
  geolocator: 14.1.2
  go_router: 18.1.3
  hooks_riverpod: 3.5.0
  intl: 0.20.3
  mobile_scanner: 7.5.0
  mp_camera: 0.1.4
  mp_core: 0.1.4
  mp_vision: 0.1.4
  path_provider: 2.1.6
  qr_flutter: 4.1.0
  record: 7.1.2
  sensors_plus: 7.1.1
  serverpod_auth_idp_flutter: 4.1.1
  serverpod_flutter: 4.1.1
  shared_preferences: 2.5.6
  skribble: 0.3.1
  skribble_emoji: 0.3.1
  skribble_font_recursive: 0.3.1
  skribble_maps: 0.3.1
  solana_kit: 0.11.1
  solana_kit_mobile_wallet_adapter: 0.7.1
  solana_kit_mobile_wallet_adapter_protocol: 0.7.1
  url_launcher: 6.3.3
  uuid: 4.6.0
  verily_brand:
    path: ../packages/verily_brand
  verily_client:
    path: ../verily_client
  verily_evidence:
    path: ../packages/verily_evidence
  video_player: 2.14.1

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: 4.11.0
  # Source of the hand-drawn Lucide catalog that
  # tool/generate_verily_icons.dart copies from; never imported by the app.
  skribble_icons_lucide: 0.3.1
  # Shared analysis options; the analyzer plugin itself loads by path from
  # analysis_options.yaml.
  verily_lints:
    path: ../packages/verily_lints

patrol:
  app_name: Verily
  android:
    package_name: fun.verily.app
  ios:
    bundle_id: fun.verily.app

flutter_launcher_icons:
  # Full-bleed vermilion with the paper pin-check; launchers apply their own
  # mask. Re-render the foreground with tool/render_branding_test.dart.
  image_path: ../brand/verily-app-icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#D13F22"
  adaptive_icon_foreground: assets/branding/launcher_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/branding/launcher_foreground.png
  web:
    generate: true
    image_path: ../brand/verily-app-icon.png
    background_color: "#FFFAF0"
    theme_color: "#D13F22"

flutter_native_splash:
  color: "#FFFAF0"
  image: assets/branding/splash_mark.png
  color_dark: "#292331"
  image_dark: assets/branding/splash_mark_dark.png
  android: true
  android_screen_orientation: portrait
  ios: true
  web: false
  android_12:
    color: "#FFFAF0"
    image: assets/branding/splash_android12.png
    color_dark: "#292331"
    image_dark: assets/branding/splash_android12_dark.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    # The server rewrites this file for the web app; mobile builds use it as
    # the default API address unless SERVER_URL is set.
    - assets/config.json
