name: verily_flutter
description: Do it, prove it, get paid. Real-world actions with live-captured proof and escrowed rewards.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Standalone until the root workspace pubspec and the generated Serverpod
# client land; phase B adds `resolution: workspace` and `verily_client`.

# Every hosted dependency names one exact version; the verily_lints
# `enforce_pinned_app_dependencies` rule rejects carets and ranges here.
dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: 0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: 2.4.8
  go_router: 18.0.2
  hooks_riverpod: 3.4.3
  intl: 0.20.3
  sensors_plus: 7.1.1
  shared_preferences: 2.5.6
  skribble: 0.3.1
  skribble_emoji: 0.3.1
  skribble_font_recursive: 0.3.1
  skribble_maps: 0.3.1
  url_launcher: 6.3.3

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: 4.10.0
  # Source of the hand-drawn Lucide catalog that
  # tool/generate_verily_icons.dart copies from; never imported by the app.
  skribble_icons_lucide: 0.3.1
  # Shared analysis options; the analyzer plugin itself loads by path from
  # analysis_options.yaml.
  verily_lints:
    path: ../packages/verily_lints

patrol:
  app_name: Verily
  android:
    package_name: fun.verily.app
  ios:
    bundle_id: fun.verily.app

flutter_native_splash:
  color: "#FFFAF0"
  color_dark: "#292331"
  android: true
  android_screen_orientation: portrait
  ios: true
  web: true
  android_12:
    color: "#FFFAF0"
    color_dark: "#292331"

flutter:
  generate: true
  uses-material-design: true
