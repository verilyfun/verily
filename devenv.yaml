# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  ifiokjr-nixpkgs:
    # Monosecret 0.5.0, matching the monosecret package the server pins.
    url: github:ifiokjr/nixpkgs/6916068e520396144ebab9b83fb4ab81ddc3f879
    inputs:
      nixpkgs:
        follows: nixpkgs
  ifiokjr-nixpkgs-pina:
    # Keep Pina's generator and security lints aligned with the framework
    # version pinned in Cargo.toml (0.24.0; lint driver built for
    # nightly-2026-09-15, the toolchain this repository pins).
    url: github:ifiokjr/nixpkgs/6916068e520396144ebab9b83fb4ab81ddc3f879
    inputs:
      nixpkgs:
        follows: nixpkgs
  ifiokjr-nixpkgs-monochange:
    # Monochange 0.21.0, without upgrading unrelated development tools.
    url: github:ifiokjr/nixpkgs/6916068e520396144ebab9b83fb4ab81ddc3f879
    inputs:
      nixpkgs:
        follows: nixpkgs
  ifiokjr-nixpkgs-serverpod:
    # Keep code generation aligned with the Serverpod packages in this workspace.
    url: github:ifiokjr/nixpkgs/6916068e520396144ebab9b83fb4ab81ddc3f879
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
    overlays:
      - default
allowUnfree: true
