### The public, checkable facts about an action's reward.
class: RewardSummary
fields:
  cluster: RewardCluster
  mint: String
  tokenSymbol: String
  decimals: int
  amountPerPayout: int
  maxPayouts: int
  payoutsRemaining: int
  maxWinsPerAccount: int
  ### Payouts the viewing account already holds from this pool.
  myWins: int
  status: RewardPoolStatus
  expiresAt: DateTime
  ### Anyone can read this escrow on chain; null until funding starts.
  escrowAddress: String?
