### Identity-purge receipt retained after sign-in is blocked; never a public profile.
class: AccountClosure
serverOnly: true
table: verily_account_closure
fields:
  id: UuidValue?, defaultPersist=random_v7
  authUserId: UuidValue, relation(parent=serverpod_auth_core_user, onDelete=Restrict)
  status: AccountClosureStatus, default=closed
  requestedAt: DateTime, default=now
  identityPurgedAt: DateTime, default=now
indexes:
  verily_account_closure_user_unique_idx:
    fields: authUserId
    unique: true
  verily_account_closure_requested_idx:
    fields: requestedAt
