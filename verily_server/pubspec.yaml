name: verily_server
description: Verily's Serverpod backend for actions, proof verification, and escrowed rewards.
version: 1.0.0
publish_to: none

environment:
  sdk: "^3.13.0"

resolution: workspace

dependencies:
  amazon_cognito_identity_dart_2: ^3.8.2
  bs58: ^1.0.2
  crypto: ^3.0.8
  ed25519_edwards: ^0.3.2
  googleapis_auth: 2.3.5
  http: ^1.6.0
  monosecret: 0.5.0
  # MediaPipe replay of phone-only local checks (gesture, object, sound). The
  # same pinned packages as verily_flutter; native runtime via build hooks.
  mp_audio: 0.1.3
  mp_core: 0.1.3
  mp_vision: 0.1.3
  pointycastle: 4.0.0
  serverpod: 4.0.4
  serverpod_auth_core_server: 4.0.4
  serverpod_auth_idp_server: 4.0.4
  serverpod_cloud_storage_s3_compat: 4.0.4
  solana_kit: 0.11.1
  solana_kit_rpc_api: 0.11.1
  solana_kit_rpc_spec: 0.11.1
  solana_kit_rpc_types: 0.11.1
  solana_kit_token: 0.10.1
  # timezone 0.11 drops the IANA backward links (UTC, GMT, US/Eastern,
  # Asia/Calcutta, ...) that devices still report. Stay on 0.10 until actions
  # canonicalize their zone names.
  timezone: ^0.11.2
  verily_escrow_client:
    path: ../packages/verily_escrow_client
  verily_evidence:
    path: ../packages/verily_evidence

dev_dependencies:
  serverpod_test: 4.0.4
  test: ^1.25.5
  very_good_analysis: ^10.2.0
