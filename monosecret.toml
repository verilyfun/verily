[project]
name = "verily"
revision = "1.0"
require_reason = "agents"

[providers]
# Local development resolves secrets from the ignored root .env first, then
# from the Development vault through the service-account token, and finally
# through desktop-app integration when the token is missing or its service
# account is gone. The token itself comes from the same ignored .env through
# depends_on, and Monosecret batches 1Password reads to one billed request per
# item. The Dart SDK used by the Serverpod bootstrap cannot parse fallback or
# cache route aliases yet, so the fallback order lives in the development
# profile defaults below. Test, staging, and production are environment-only.
dotenv = "dotenv:.env"
injected = "env://"
op = { uri = "op+token://Development", ref = { item = "Verily", field = "{key}" }, depends_on = [{ secret = "OP_SERVICE_ACCOUNT_TOKEN" }] }
op_desktop = { uri = "onepassword://kickjump@Development", ref = { item = "Verily", field = "{key}" } }

[groups]
bootstrap = "Secret-provider authentication"
serverpod = "Serverpod runtime"
verification = "Proof verification and AI"
storage = "Object storage"

[profiles.default.defaults]
providers = ["injected"]

[profiles.default]
SERVERPOD_DATABASE_PASSWORD = { description = "Postgres password used by Serverpod", required = true, groups = ["serverpod"] }
SERVERPOD_SERVICE_SECRET = { description = "Serverpod Insights service secret", required = true, groups = ["serverpod"] }
SERVERPOD_REDIS_PASSWORD = { description = "Redis password when Redis is enabled", required = false, groups = ["serverpod"] }
SERVERPOD_PASSWORD_emailSecretHashPepper = { description = "Pepper for email identity hashes", required = true, groups = ["serverpod"] }
SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey = { description = "HMAC-SHA512 key used to sign JWT access tokens", required = true, groups = ["serverpod"] }
SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper = { description = "Pepper for JWT refresh-token hashes", required = true, groups = ["serverpod"] }
SERVERPOD_PASSWORD_googleClientSecret = { description = "Optional Google identity-provider client configuration", required = false, groups = ["serverpod"] }
VERILY_RESEND_API_KEY = { description = "Optional Resend API key for email verification codes", required = false, groups = ["serverpod"] }
VERILY_PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON = { description = "Google service-account JSON used only by Serverpod to decode Play Integrity tokens", required = false, groups = ["verification"] }
VERILY_MEDIA_VERIFIER_TOKEN = { description = "Bearer token for an approved private media-verification service", required = false, groups = ["verification"] }
VERILY_OPENROUTER_API_KEY = { description = "Backend-only OpenRouter key for proof verification and AI drafting", required = false, groups = ["verification"] }
VERILY_ABUSE_PSEUDONYM_SECRET = { description = "HMAC secret used only for private, rotating abuse-correlation pseudonyms", required = false, groups = ["serverpod"] }
VERILY_EVIDENCE_B2_S3_ENDPOINT = { description = "Backblaze S3-compatible endpoint for private action evidence", required = false, groups = ["storage"] }
VERILY_EVIDENCE_B2_REGION = { description = "Backblaze region for private action evidence", required = false, groups = ["storage"] }
VERILY_EVIDENCE_B2_BUCKET_NAME = { description = "Private Backblaze bucket for short-lived action evidence", required = false, groups = ["storage"] }
VERILY_EVIDENCE_B2_KEY_ID = { description = "Bucket-scoped Backblaze application key identifier", required = false, groups = ["storage"] }
VERILY_EVIDENCE_B2_APPLICATION_KEY = { description = "Bucket-scoped Backblaze application key", required = false, groups = ["storage"] }

[profiles.development.defaults]
# The development route reads the ignored root .env first, the Development
# vault through the service-account token second, the same vault through
# desktop-app integration third, and the process environment last.
providers = ["dotenv", "op", "op_desktop", "injected"]

[profiles.development]
OP_SERVICE_ACCOUNT_TOKEN = { description = "1Password service-account token kept in ignored .env; bootstraps the 1Password route and manual CLI reads only", required = false, providers = ["dotenv", "injected"], groups = ["bootstrap"] }
SERVERPOD_DATABASE_PASSWORD = { description = "Ignored local password for loopback Postgres trust authentication", required = false, default = "local-postgres-trust-auth", providers = ["dotenv", "injected"] }
SERVERPOD_REDIS_PASSWORD = { description = "Optional Redis password when Redis is enabled", required = false, providers = ["dotenv", "injected"], groups = ["serverpod"] }
SERVERPOD_PASSWORD_googleClientSecret = { description = "Optional Google identity-provider client configuration", required = false, groups = ["serverpod"] }
SERVERPOD_SERVICE_SECRET = { description = "Local Serverpod service secret persisted in ignored .env, generated when absent", type = "base64", generate = { bytes = 48 } }
SERVERPOD_PASSWORD_emailSecretHashPepper = { description = "Local email hash pepper persisted in ignored .env, generated when absent", type = "base64", generate = { bytes = 48 } }
SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey = { description = "Local JWT signing key persisted in ignored .env, generated when absent", type = "base64", generate = { bytes = 64 } }
SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper = { description = "Local refresh-token pepper persisted in ignored .env, generated when absent", type = "base64", generate = { bytes = 48 } }
VERILY_ABUSE_PSEUDONYM_SECRET = { description = "Local abuse pseudonym secret persisted in ignored .env, generated when absent", required = false, type = "base64", generate = { bytes = 48 } }
# Backblaze is optional in development: without these values the server uses
# local database evidence storage so a fresh checkout runs end to end.
VERILY_EVIDENCE_B2_S3_ENDPOINT = { description = "Optional Backblaze evidence S3 endpoint read from ignored .env first, then the Development vault", required = false, groups = ["storage"] }
VERILY_EVIDENCE_B2_REGION = { description = "Optional Backblaze evidence region read from ignored .env first, then the Development vault", required = false, groups = ["storage"] }
VERILY_EVIDENCE_B2_BUCKET_NAME = { description = "Optional private evidence bucket read from ignored .env first, then the Development vault", required = false, groups = ["storage"] }
VERILY_EVIDENCE_B2_KEY_ID = { description = "Optional bucket-scoped evidence key identifier read from ignored .env first, then the Development vault", required = false, groups = ["storage"] }
VERILY_EVIDENCE_B2_APPLICATION_KEY = { description = "Optional bucket-scoped evidence application key read from ignored .env first, then the Development vault", required = false, groups = ["storage"] }
VERILY_RESEND_API_KEY = { description = "Optional Resend API key read from ignored .env first, then the Development vault", required = false, groups = ["serverpod"] }
VERILY_PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON = { description = "Optional development Play Integrity decoder credential read from ignored .env first, then the Development vault", required = false, groups = ["verification"] }
VERILY_MEDIA_VERIFIER_TOKEN = { description = "Optional media-verifier service token read from ignored .env first, then the Development vault", required = false, groups = ["verification"] }
VERILY_OPENROUTER_API_KEY = { description = "Optional backend-only OpenRouter key read from ignored .env first, then the Development vault", required = false, groups = ["verification"] }

[profiles.test.defaults]
providers = ["injected"]

[profiles.test]
SERVERPOD_DATABASE_PASSWORD = { description = "Public test-only value for Postgres trust authentication", required = false, default = "test-postgres-trust-auth" }
SERVERPOD_SERVICE_SECRET = { description = "Public test-only Serverpod service secret", required = false, default = "public-test-only-serverpod-service-secret" }
SERVERPOD_PASSWORD_emailSecretHashPepper = { description = "Public test-only email hash pepper", required = false, default = "public-test-only-email-hash-pepper" }
SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey = { description = "Public test-only JWT signing key", required = false, default = "public-test-only-jwt-signing-key" }
SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper = { description = "Public test-only refresh-token pepper", required = false, default = "public-test-only-refresh-token-pepper" }
VERILY_ABUSE_PSEUDONYM_SECRET = { description = "Public test-only abuse pseudonym secret", required = false, default = "public-test-only-abuse-pseudonym-secret" }

[profiles.staging.defaults]
providers = ["injected"]

[profiles.staging]
SERVERPOD_DATABASE_PASSWORD = { description = "Staging Postgres password injected by the container host", required = true }
VERILY_EVIDENCE_B2_S3_ENDPOINT = { description = "Staging Backblaze evidence S3 endpoint", required = true }
VERILY_EVIDENCE_B2_REGION = { description = "Staging Backblaze evidence region", required = true }
VERILY_EVIDENCE_B2_BUCKET_NAME = { description = "Staging private evidence bucket", required = true }
VERILY_EVIDENCE_B2_KEY_ID = { description = "Staging bucket-scoped evidence key identifier", required = true }
VERILY_EVIDENCE_B2_APPLICATION_KEY = { description = "Staging bucket-scoped evidence application key", required = true }
VERILY_OPENROUTER_API_KEY = { description = "OpenRouter key when AI verification or drafting is enabled", required = false }
VERILY_ABUSE_PSEUDONYM_SECRET = { description = "Staging abuse pseudonym secret", required = false }

[profiles.production.defaults]
# Production application processes are intentionally environment-only. A
# deploy-time operator may materialize 1Password references into the
# root-owned environment file, but process restarts must never query
# 1Password.
providers = ["injected"]

[profiles.production]
SERVERPOD_DATABASE_PASSWORD = { description = "Production Postgres password injected by the container host", required = true }
VERILY_EVIDENCE_B2_S3_ENDPOINT = { description = "Production Backblaze evidence S3 endpoint", required = true }
VERILY_EVIDENCE_B2_REGION = { description = "Production Backblaze evidence region", required = true }
VERILY_EVIDENCE_B2_BUCKET_NAME = { description = "Production private evidence bucket", required = true }
VERILY_EVIDENCE_B2_KEY_ID = { description = "Production bucket-scoped evidence key identifier", required = true }
VERILY_EVIDENCE_B2_APPLICATION_KEY = { description = "Production bucket-scoped evidence application key", required = true }
VERILY_RESEND_API_KEY = { description = "Resend API key when production email authentication is enabled", required = false }
VERILY_PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON = { description = "Google service-account JSON required before an Android production release", required = false }
VERILY_MEDIA_VERIFIER_TOKEN = { description = "Bearer token required when cloud media verification is enabled", required = false }
VERILY_OPENROUTER_API_KEY = { description = "OpenRouter key when AI verification or drafting is enabled", required = false }
VERILY_ABUSE_PSEUDONYM_SECRET = { description = "Production abuse pseudonym secret", required = false }
