# Root Monosecret manifest for Verily (LeptosKit stack).
# Local development reads the ignored root .env first, then the Development
# vault item "Verily". Staging, test, and production are environment-only.

[project]
name = "verily"
revision = "2.0"
require_reason = "agents"

[providers]
dotenv = "dotenv:.env"
injected = "env://"
op = { uri = "op+token://Development", ref = { item = "Verily", field = "{key}" }, depends_on = [{ secret = "OP_SERVICE_ACCOUNT_TOKEN" }] }
op_desktop = { uri = "onepassword://kickjump@Development", ref = { item = "Verily", field = "{key}" } }

[groups]
bootstrap = "Secret-provider authentication"
runtime = "LeptosKit server and authentication"
verification = "Proof verification, device attestation, and AI"
storage = "Backblaze B2 private evidence storage"
rewards = "Solana reward escrow and KMS custody"
platform = "Partner Verily Apps signing keys"

[profiles.default.defaults]
providers = ["injected"]

[profiles.default]
DATABASE_URL = { description = "Postgres + PostGIS URL for verily-kit", required = true, groups = ["runtime"] }
AUTH_ENCRYPTION_KEYS = { description = "Sign-in encryption key ring for leptoskit_auth", required = true, groups = ["runtime"] }
VERILY_RESEND_API_KEY = { description = "Resend API key for email sign-in codes", required = false, groups = ["runtime"] }
VERILY_GOOGLE_CLIENT_ID = { description = "Google OAuth client ID", required = false, groups = ["runtime"] }
VERILY_GOOGLE_CLIENT_SECRET = { description = "Google OAuth client secret", required = false, groups = ["runtime"] }
VERILY_ABUSE_RISK_SALT = { description = "Rotating salt for abuse-correlation pseudonyms", required = false, groups = ["runtime"] }
VERILY_RECEIPT_SIGNING_PRIVATE_KEY = { description = "Ed25519 seed (32 bytes, base64) for partner receipts", required = false, groups = ["platform"] }
VERILY_B2_ENDPOINT = { description = "Backblaze B2 S3-compatible endpoint", required = false, groups = ["storage"] }
VERILY_B2_REGION = { description = "Backblaze B2 region", required = false, groups = ["storage"] }
VERILY_B2_BUCKET = { description = "Backblaze B2 private evidence bucket", required = false, groups = ["storage"] }
VERILY_B2_KEY_ID = { description = "Backblaze B2 application key ID", required = false, groups = ["storage"] }
VERILY_B2_APPLICATION_KEY = { description = "Backblaze B2 application key", required = false, groups = ["storage"] }
VERILY_OPENROUTER_API_KEY = { description = "Backend-only OpenRouter key for AI verification and drafting", required = false, groups = ["verification"] }
VERILY_MEDIA_VERIFIER_TOKEN = { description = "Bearer token for an approved private media verifier", required = false, groups = ["verification"] }
VERILY_GOOGLE_PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON = { description = "Google service-account JSON for Play Integrity decoding", required = false, groups = ["verification"] }
VERILY_APPLE_DEVICECHECK_KEY_ID = { description = "Apple DeviceCheck key ID", required = false, groups = ["verification"] }
VERILY_APPLE_DEVICECHECK_PRIVATE_KEY = { description = "Apple DeviceCheck P-256 PKCS#8 private key (.p8)", required = false, groups = ["verification"] }
VERILY_REWARD_SOLANA_RPC_URL = { description = "Solana RPC URL for reward escrow", required = false, groups = ["rewards"] }
VERILY_REWARD_KMS_CREDENTIALS_JSON = { description = "Google Cloud KMS credentials JSON for reward signing", required = false, groups = ["rewards"] }

[profiles.development.defaults]
providers = ["dotenv", "op", "op_desktop", "injected"]

[profiles.development]
OP_SERVICE_ACCOUNT_TOKEN = { description = "1Password service-account token kept in ignored .env", required = false, providers = ["dotenv", "injected"], groups = ["bootstrap"] }
DATABASE_URL = { description = "Local Postgres + PostGIS URL", required = false, default = "postgres://postgres@127.0.0.1:8191/verily", providers = ["dotenv", "injected"], groups = ["runtime"] }
AUTH_ENCRYPTION_KEYS = { description = "Local sign-in encryption key generated when absent", required = false, type = "base64", generate = { bytes = 32 }, groups = ["runtime"] }
VERILY_ABUSE_RISK_SALT = { description = "Local abuse-correlation salt generated when absent", required = false, type = "base64", generate = { bytes = 32 }, groups = ["runtime"] }
VERILY_RECEIPT_SIGNING_PRIVATE_KEY = { description = "Local Ed25519 receipt seed generated when absent", required = false, type = "base64", generate = { bytes = 32 }, groups = ["platform"] }
VERILY_RESEND_API_KEY = { description = "Optional development Resend API key", required = false, groups = ["runtime"] }
VERILY_GOOGLE_CLIENT_ID = { description = "Optional development Google OAuth client ID", required = false, groups = ["runtime"] }
VERILY_GOOGLE_CLIENT_SECRET = { description = "Optional development Google OAuth client secret", required = false, groups = ["runtime"] }
VERILY_B2_ENDPOINT = { description = "Optional Backblaze B2 S3 endpoint", required = false, groups = ["storage"] }
VERILY_B2_REGION = { description = "Optional Backblaze B2 region", required = false, groups = ["storage"] }
VERILY_B2_BUCKET = { description = "Optional Backblaze B2 bucket", required = false, groups = ["storage"] }
VERILY_B2_KEY_ID = { description = "Optional Backblaze B2 key ID", required = false, groups = ["storage"] }
VERILY_B2_APPLICATION_KEY = { description = "Optional Backblaze B2 application key", required = false, groups = ["storage"] }
VERILY_OPENROUTER_API_KEY = { description = "Optional development OpenRouter key", required = false, groups = ["verification"] }
VERILY_MEDIA_VERIFIER_TOKEN = { description = "Optional media-verifier token", required = false, groups = ["verification"] }
VERILY_GOOGLE_PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON = { description = "Optional Play Integrity decoder credential", required = false, groups = ["verification"] }
VERILY_APPLE_DEVICECHECK_KEY_ID = { description = "Optional local Apple DeviceCheck key ID", required = false, providers = ["dotenv", "injected"], groups = ["verification"] }
VERILY_APPLE_DEVICECHECK_PRIVATE_KEY = { description = "Optional local Apple DeviceCheck private key", required = false, providers = ["dotenv", "injected"], groups = ["verification"] }
VERILY_REWARD_SOLANA_RPC_URL = { description = "Optional devnet or local-validator Solana RPC URL", required = false, groups = ["rewards"] }
VERILY_REWARD_ARBITER_KEYPAIR = { description = "Optional devnet-only arbiter keypair (Solana CLI JSON array)", required = false, groups = ["rewards"] }
VERILY_REWARD_FEE_PAYER_KEYPAIR = { description = "Optional devnet-only fee-payer keypair (Solana CLI JSON array)", required = false, groups = ["rewards"] }
VERILY_REWARD_KMS_CREDENTIALS_JSON = { description = "Optional Cloud KMS credentials JSON for development", required = false, groups = ["rewards"] }

[profiles.test.defaults]
providers = ["injected"]

[profiles.test]
DATABASE_URL = { description = "Test Postgres URL", required = false, default = "postgres://postgres@127.0.0.1:8191/verily_test" }
AUTH_ENCRYPTION_KEYS = { description = "Public test-only auth key", required = false, default = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
VERILY_ABUSE_RISK_SALT = { description = "Public test-only abuse risk salt", required = false, default = "public-test-only-abuse-risk-salt" }
VERILY_RECEIPT_SIGNING_PRIVATE_KEY = { description = "Public test-only Ed25519 receipt seed", required = false, default = "cHVibGljLXRlc3Qtb25seS1yZWNlaXB0LXNlZWQtMDA=" }

[profiles.staging.defaults]
providers = ["injected"]

[profiles.staging]
DATABASE_URL = { description = "Staging Postgres + PostGIS connection URL", required = true }
AUTH_ENCRYPTION_KEYS = { description = "Staging sign-in encryption key ring", required = true }
VERILY_ABUSE_RISK_SALT = { description = "Staging abuse-correlation pseudonym salt", required = true }
VERILY_RECEIPT_SIGNING_PRIVATE_KEY = { description = "Staging Ed25519 receipt seed", required = true }
VERILY_B2_ENDPOINT = { description = "Staging Backblaze B2 S3 endpoint", required = true }
VERILY_B2_REGION = { description = "Staging Backblaze B2 region", required = true }
VERILY_B2_BUCKET = { description = "Staging Backblaze B2 private evidence bucket", required = true }
VERILY_B2_KEY_ID = { description = "Staging Backblaze B2 key ID", required = true }
VERILY_B2_APPLICATION_KEY = { description = "Staging Backblaze B2 application key", required = true }
VERILY_OPENROUTER_API_KEY = { description = "Staging OpenRouter API key", required = false }
VERILY_REWARD_SOLANA_RPC_URL = { description = "Staging Solana RPC URL", required = false }
VERILY_REWARD_KMS_CREDENTIALS_JSON = { description = "Staging Cloud KMS credentials JSON", required = false }

[profiles.production.defaults]
# Production application processes are strictly environment-only.
providers = ["injected"]

[profiles.production]
DATABASE_URL = { description = "Production Postgres + PostGIS connection URL", required = true }
AUTH_ENCRYPTION_KEYS = { description = "Production sign-in encryption key ring", required = true }
VERILY_ABUSE_RISK_SALT = { description = "Production abuse-correlation pseudonym salt", required = true }
VERILY_RECEIPT_SIGNING_PRIVATE_KEY = { description = "Production Ed25519 receipt seed", required = true }
VERILY_B2_ENDPOINT = { description = "Production Backblaze B2 S3 endpoint", required = true }
VERILY_B2_REGION = { description = "Production Backblaze B2 region", required = true }
VERILY_B2_BUCKET = { description = "Production Backblaze B2 private evidence bucket", required = true }
VERILY_B2_KEY_ID = { description = "Production Backblaze B2 key ID", required = true }
VERILY_B2_APPLICATION_KEY = { description = "Production Backblaze B2 application key", required = true }
VERILY_RESEND_API_KEY = { description = "Production Resend API key for email sign-in", required = false }
VERILY_GOOGLE_CLIENT_ID = { description = "Production Google OAuth client ID", required = false }
VERILY_GOOGLE_CLIENT_SECRET = { description = "Production Google OAuth client secret", required = false }
VERILY_GOOGLE_PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON = { description = "Production Play Integrity service-account JSON", required = false }
VERILY_APPLE_DEVICECHECK_KEY_ID = { description = "Production Apple DeviceCheck key ID", required = false }
VERILY_APPLE_DEVICECHECK_PRIVATE_KEY = { description = "Production Apple DeviceCheck private key", required = false }
VERILY_MEDIA_VERIFIER_TOKEN = { description = "Bearer token when external cloud media verification is enabled", required = false }
VERILY_OPENROUTER_API_KEY = { description = "Production OpenRouter key (requires guardrail confirmation + ZDR)", required = false }
VERILY_REWARD_SOLANA_RPC_URL = { description = "Production Solana RPC URL when reward escrow is enabled", required = false }
VERILY_REWARD_KMS_CREDENTIALS_JSON = { description = "Production Cloud KMS service-account JSON for reward signing", required = false }
